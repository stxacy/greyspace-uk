<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Grey Space Recordings</title>
  <meta name="description" content="Photos from Grey Space Recordings events and sessions.">
  <link rel="icon" href="../Icon%20filled_All%20light.png" type="image/png">
  <link rel="apple-touch-icon" href="../Icon%20filled_All%20light.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Gallery — Grey Space Recordings">
  <meta property="og:description" content="Photos from Grey Space Recordings events and sessions.">
  <meta property="og:image" content="https://greyspacerecordings.co.uk/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://greyspacerecordings.co.uk/gallery/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://greyspacerecordings.co.uk/gallery/">
  <link rel="stylesheet" href="../style.css">
  <style>
    /* ─── EVENT GRID ─── */
    .event-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
    }

    .event-card {
      display: block;
      text-decoration: none;
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
      transition: background 0.2s;
    }

    .event-card:hover { background: var(--bg-2); }

    /* ─── PHOTO STACK ─── */
    .event-stack-wrap {
      padding: 1.5rem 1.5rem 0;
    }

    .event-stack {
      position: relative;
      aspect-ratio: 4/3;
    }

    .stack-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.55s ease;
    }

    /* back cards: rotated behind the front */
    .stack-l2 {
      transform: rotate(-4.5deg);
      filter: brightness(0.45) grayscale(60%);
    }

    .stack-l1 {
      transform: rotate(2.8deg);
      filter: brightness(0.6) grayscale(35%);
    }

    /* hover: fan out */
    .event-card:hover .stack-l2 {
      transform: rotate(-8deg);
      filter: brightness(0.55) grayscale(40%);
    }

    .event-card:hover .stack-l1 {
      transform: rotate(5deg);
      filter: brightness(0.7) grayscale(20%);
    }

    /* ─── EVENT INFO ─── */
    .event-info {
      padding: 1.5rem;
      border-top: 1px solid var(--border);
      margin-top: 1.5rem;
    }

    .event-eyebrow {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .event-name {
      font-family: var(--head);
      font-size: 1.6rem;
      letter-spacing: 0.02em;
      line-height: 1;
      margin-bottom: 1rem;
    }

    .event-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .event-venue {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    .event-cta {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 0.4rem 0.875rem;
      border: 1px solid var(--border);
      color: var(--muted);
      transition: border-color 0.2s, color 0.2s;
    }

    .event-card:hover .event-cta {
      border-color: rgba(0, 51, 255, 0.5);
      color: var(--accent);
    }

    /* ─── MOBILE ─── */
    @media (max-width: 768px) {
      .event-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 480px) {
      .event-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ─── SPLASH ─── -->
  <div class="splash" id="splash">
    <div class="splash-logo-wrap"><div class="splash-logo-spin"><img class="splash-logo" src="../Icon%20filled_All%20Grey.png" alt="Grey Space Recordings"></div></div>
    <p class="splash-enter" id="splash-enter">Click to Enter</p>
  </div>

  <nav id="nav">
    <a href="../" class="nav-logo">
      <img src="../Icon%20filled_All%20light.png" alt="Grey Space Recordings">
    </a>
    <button class="nav-hamburger" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links">
      <li><a href="../about/">About</a></li>
      <li><a href="../events/">Events</a></li>
      <li><a href="../merch/">Merch</a></li>
      <li><a href="../gallery/" class="active">Gallery</a></li>
      <li><a href="../contact/">Contact</a></li>
    </ul>
  </nav>

  <div class="page-hero">
    <p class="page-hero-eyebrow">Grey Space Recordings</p>
    <h1 class="page-hero-title">Gallery</h1>
  </div>

  <section class="section">
    <div class="event-grid">

      <a href="bday-bash/" class="event-card reveal">
        <div class="event-stack-wrap">
          <div class="event-stack">
            <div class="stack-layer stack-l2" style="background-image: url('../images/bday-bash/photo-11.jpg')"></div>
            <div class="stack-layer stack-l1" style="background-image: url('../images/bday-bash/photo-14.jpg')"></div>
            <div class="stack-layer stack-l0" style="background-image: url('../images/bday-bash/photo-05.jpg')"></div>
          </div>
        </div>
        <div class="event-info">
          <p class="event-eyebrow">19 Photos &middot; 05.06.26</p>
          <p class="event-name">ALR &amp; Laza<br>Bday Bash</p>
          <div class="event-footer">
            <span class="event-venue">The Bell, Bristol</span>
            <span class="event-cta">View</span>
          </div>
        </div>
      </a>

    </div>
  </section>

  <footer>
    <div class="footer-logo">
      <img src="../Icon%20filled_All%20light.png" alt="Grey Space Recordings">
    </div>
    <p class="footer-copy">&copy; Grey Space 2026</p>
    <div class="footer-socials" aria-label="Social links">
      <a href="https://www.instagram.com/greyspace.uk/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/></svg></a>
      <a href="#" aria-label="Bandcamp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M0 18.75l7.437-13.5H24l-7.438 13.5z"/></svg></a>
      <a href="#" aria-label="Soundcloud"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 8.4A5.5 5.5 0 0 0 15 4a5.45 5.45 0 0 0-3.94 1.68A4 4 0 0 0 8 5a4 4 0 0 0-1.93 7.5A3 3 0 1 0 9 18h11a4 4 0 0 0 .5-7.6z"/></svg></a>
    </div>
  </footer>

  <script src="../splash.js"></script>
  <script>
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 60);
    }, { passive: true });

    function initReveal() {
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add('in-view');
            obs.unobserve(e.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
      document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
    }
    if (document.body.classList.contains('page-ready')) {
      initReveal();
    } else {
      const mo = new MutationObserver(() => {
        if (document.body.classList.contains('page-ready')) {
          mo.disconnect();
          initReveal();
        }
      });
      mo.observe(document.body, { attributes: true, attributeFilter: ['class'] });
    }

    const hamburger = document.querySelector('.nav-hamburger');
    const navLinks  = document.querySelector('.nav-links');
    hamburger.addEventListener('click', () => {
      const open = navLinks.classList.toggle('open');
      hamburger.classList.toggle('open', open);
      hamburger.setAttribute('aria-expanded', open);
    });
  </script>

  <script src="../cookies.js"></script>
</body>
</html>
